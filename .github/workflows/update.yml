name: Update stats
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - name: NFL data
        run: python scripts/fetch_nfl.py
        continue-on-error: true
      - name: NBA data
        run: python scripts/fetch_nba.py
        continue-on-error: true
      - name: Save changes
        run: |
          git config user.name "stats bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update data"
          git push
